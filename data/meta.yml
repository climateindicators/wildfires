  source_sha256: 5326d82e6fee79741760fe39ca66dd7d1139efeb5db5c0e69d97bcbaf7da1317
  source_encoding: UTF-8-BOM
  data_source: MTBS, 2023
  web_update: June 2024
  unit: burned area (millions of acres per year)
  rows: 48
  columns:
  - name: month
    type: string
    description: Calendar month name, in January-to-December order.
  - name: region
    type: string
    description: Half of the country the value covers, East or West.
  - name: period
    type: string
    description: Multi-year period the value averages over, 1984-2002 or 2003-2021.
  - name: million_acres
    type: number
    description: Average burned area for that month, in millions of acres per year.
