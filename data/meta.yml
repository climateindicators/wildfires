  source_file: wildfires_fig-5.csv
  source_sha256: df6cae8eb94f6ae8cf2306ca6dbe7f9dcfbfae636def89c8169fb93cb07495bb
  source_encoding: UTF-8
  data_source: MTBS, 2024
  web_update: June 2024
  unit: acres per square mile of land area
  rows: 45
  columns:
  - name: state
    type: string
    description: U.S. state. Two-letter postal abbreviation where the source uses
      one, full name where it does not.
  - name: change_acres_per_sq_mi
    type: number
    description: Change in average annual burned acreage between 1984-2002 and 2003-2021,
      in acres per square mile of land area. Negative values are decreases.
- file: wildfires_monthly_burned_area.csv
  figure: Figure 6
  figure_title: Figure 6. Comparison of Monthly Burned Area Due to Wildfires in the
    United States Between 1984–2002 and 2003–2021
  source_file: wildfires_fig-6.csv
  source_sha256: 2845031395c0b404b698ff655683df381376c588857b771600548125632b615c
  source_encoding: UTF-8-BOM
  data_source: MTBS, 2023
  web_update: June 2024
  unit: burned area (millions of acres per year)
  rows: 24
  columns:
  - name: month
    type: string
    description: Calendar month name, in January-to-December order.
  - name: period
    type: string
    description: Multi-year period the value averages over, 1984-2002 or 2003-2021.
  - name: million_acres
    type: number
    description: Average burned area for that month, in millions of acres per year.
- file: wildfires_monthly_burned_area_by_region.csv
  figure: Figure 7
  figure_title: Figure 7. Comparison of Monthly Burned Area Due to Wildfires in the
